[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zave-cli"
version = "0.1.0"
description = "ZaveStudios platform workload generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
]

[project.scripts]
zave = "zave.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
